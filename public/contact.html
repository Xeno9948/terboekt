<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neem contact op voor een boeking">
    <title>Contact - Home Terboekt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Header Component -->
    <div id="header-placeholder"></div>

    <section class="page-hero" style="background-image: url('assets/img/buitenkant-zwembad-tuin.jpg');">
        <div class="hero-content">
            <h1 data-i18n="contact_title">Neem Contact Op</h1>
        </div>
    </section>

    <section>
        <div class="container">
            <div style="max-width: 600px; margin: 0 auto;">
                <!-- 
                TODO: Replace YOUR_FORM_ID with your actual Formspree form ID
                Get one free at: https://formspree.io/
            -->
                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="form-group">
                        <label for="name" data-i18n="form_name">Naam</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email" data-i18n="form_email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message" data-i18n="form_message">Bericht</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="btn" data-i18n="form_submit">Verstuur</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="assets/js/translations.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
